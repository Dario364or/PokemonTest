name: Monitor Carrefour

on:
  schedule:
    - cron: "0 * * * *"      # cada hora; la concurrencia evita solapes
  workflow_dispatch:

concurrency:
  group: carrefour-monitor
  cancel-in-progress: false  # el siguiente espera en cola a que acabe el actual

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE: "30"      # ajusta o quita según tu precio máximo